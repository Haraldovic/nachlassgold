name: Nachlassgold – Kurse und Pages
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 1,9,17 * * *'

permissions: {}
concurrency:
  group: nachlassgold-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - name: Öffentliche Website bereitstellen
        run: python3 .github/scripts/stage_site.py _site
      - name: Tageskurse abrufen und prüfen
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          METALS_DEV_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: python3 .github/scripts/update_rates.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Geprüfte Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
